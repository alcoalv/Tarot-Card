<!DOCTYPE html>
<html lang="ko">

<title>TAROT — 오프라인 3카드 운세 게임</title>
<style>
:root{--bg:#030912;--bg2:#071321;--gold:#d7aa59;--gold2:#f0d290;--gold3:#8a6834;--text:#f6ead1;--muted:#bcae91;--line:rgba(215,170,89,.35);--shadow:0 20px 70px rgba(0,0,0,.42)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Noto Serif KR","Nanum Myeongjo","Malgun Gothic",serif}body{min-height:100vh;overflow-x:hidden}button,input,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;position:relative;isolation:isolate;padding:22px;background:radial-gradient(circle at 18% 18%,rgba(48,85,125,.20),transparent 27%),radial-gradient(circle at 82% 76%,rgba(54,45,95,.15),transparent 30%),radial-gradient(circle at 50% 15%,rgba(214,170,89,.05),transparent 28%),linear-gradient(180deg,#02070d,#06101b 55%,#030812)}
.app:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;opacity:.55;background-image:radial-gradient(circle at 6% 18%,#f1cf84 0 1px,transparent 1.5px),radial-gradient(circle at 17% 74%,#f1cf84 0 1px,transparent 1.5px),radial-gradient(circle at 28% 8%,#d7aa59 0 1px,transparent 1.4px),radial-gradient(circle at 38% 47%,#f7e0aa 0 1px,transparent 1.5px),radial-gradient(circle at 50% 86%,#d7aa59 0 1px,transparent 1.5px),radial-gradient(circle at 61% 17%,#f7e0aa 0 1px,transparent 1.5px),radial-gradient(circle at 73% 63%,#d7aa59 0 1px,transparent 1.5px),radial-gradient(circle at 88% 13%,#f7e0aa 0 1px,transparent 1.5px),radial-gradient(circle at 95% 81%,#d7aa59 0 1px,transparent 1.5px);background-size:210px 190px,260px 230px,180px 210px,310px 270px,245px 215px,280px 250px,230px 205px,275px 225px,195px 245px}
.app:after{content:"";position:fixed;inset:14px;border:1px solid rgba(215,170,89,.55);pointer-events:none;z-index:20;box-shadow:inset 0 0 0 4px rgba(215,170,89,.04)}
.corner{position:fixed;width:58px;height:58px;z-index:21;pointer-events:none;opacity:.85}.corner:before,.corner:after{content:"";position:absolute;background:var(--gold)}.corner:before{width:52px;height:1px}.corner:after{height:52px;width:1px}.tl{left:14px;top:14px}.tr{right:14px;top:14px;transform:rotate(90deg)}.br{right:14px;bottom:14px;transform:rotate(180deg)}.bl{left:14px;bottom:14px;transform:rotate(270deg)}.corner i{position:absolute;left:7px;top:7px;width:18px;height:18px;border:1px solid var(--gold);border-radius:50%;border-right-color:transparent}
.shell{max-width:1460px;margin:0 auto;position:relative;z-index:2}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:8px 10px 12px}.brand{display:flex;align-items:center;gap:12px;color:var(--gold2);letter-spacing:.18em;font-size:17px}.moon{width:34px;height:34px;border:1px solid var(--gold);border-radius:50%;position:relative;box-shadow:0 0 22px rgba(215,170,89,.2)}.moon:after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:var(--bg2);left:8px;top:0}.progress{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.step{padding:7px 12px;border:1px solid rgba(215,170,89,.2);border-radius:999px;color:#7d7464;font-size:12px}.step.active{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 16px rgba(215,170,89,.12)}.step.done{color:#bda879;border-color:rgba(215,170,89,.45)}
.screen{display:none;animation:fade .35s ease}.screen.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:36px 18px 18px}.hero .eyebrow{color:var(--gold);letter-spacing:.35em;font-size:12px}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(58px,8vw,112px);letter-spacing:.13em;margin:7px 0 8px;color:var(--gold2);font-weight:500;text-shadow:0 0 28px rgba(215,170,89,.18)}.hero p{margin:0;color:#decaa2;font-size:clamp(17px,2vw,24px);letter-spacing:.04em}.rule{width:min(650px,70vw);height:1px;margin:20px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative}.rule:after{content:"◇";position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);background:#07111d;padding:0 9px;color:var(--gold)}

.helper{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 17px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px auto 25px}.btn{border:1px solid var(--gold3);background:linear-gradient(180deg,#0c2034,#071421);color:#e9d3a8;border-radius:12px;padding:12px 20px;transition:.2s}.btn:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px)}.btn.primary{min-width:260px;padding:15px 28px;font-size:20px;border-color:var(--gold);box-shadow:0 0 24px rgba(215,170,89,.08);color:var(--gold2)}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.ghost{background:transparent;color:#c6b58f}
.panel{background:linear-gradient(180deg,rgba(9,23,38,.9),rgba(5,14,24,.92));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);position:relative}.panel:after{content:"";position:absolute;inset:8px;border:1px solid rgba(215,170,89,.09);border-radius:12px;pointer-events:none}.page-title{text-align:center;padding:26px 16px 12px}.page-title .small{color:var(--gold);letter-spacing:.18em;font-size:12px}.page-title h2{margin:7px 0 5px;color:var(--gold2);font-weight:500;font-size:clamp(30px,4vw,52px)}.page-title p{color:var(--muted);margin:0;line-height:1.7}
.setup{padding:22px;max-width:1200px;margin:10px auto}.setup-grid{display:grid;grid-template-columns:1.45fr .75fr;gap:20px}.section-title{font-size:16px;color:#d9bd86;margin:0 0 13px;display:flex;align-items:center;gap:10px}.section-title:before,.section-title:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line))}.section-title:after{background:linear-gradient(90deg,var(--line),transparent)}.chips{display:flex;gap:10px;flex-wrap:wrap}.chip{border:1px solid rgba(215,170,89,.35);background:rgba(4,12,21,.55);color:#d5c29d;border-radius:999px;padding:10px 14px;font-size:13px;line-height:1.35;transition:.18s}.chip:hover,.chip.selected{border-color:var(--gold);color:var(--gold2);background:rgba(215,170,89,.08)}.custom{margin-top:13px}.custom textarea{width:100%;resize:vertical;min-height:82px;border:1px solid rgba(215,170,89,.25);border-radius:12px;background:rgba(2,8,14,.55);color:var(--text);padding:13px;outline:none}.custom textarea:focus{border-color:var(--gold)}.period-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.period{padding:11px 10px;border-radius:10px;border:1px solid rgba(215,170,89,.28);background:rgba(2,8,14,.42);color:#c5b696}.period.selected{border-color:var(--gold);color:var(--gold2);box-shadow:inset 0 0 18px rgba(215,170,89,.07)}
.preview-box{margin-top:18px;padding:16px;border-radius:14px;background:rgba(2,8,14,.46);border:1px solid rgba(215,170,89,.16)}.preview-box b{color:var(--gold2);font-weight:500}.preview-name{font-size:14px;color:#e7d6b3;margin-bottom:8px}.preview-spread{display:flex;gap:8px;flex-wrap:wrap}.preview-spread span{padding:8px 10px;border:1px solid rgba(215,170,89,.2);border-radius:999px;font-size:12px;color:#cab793}
.context-strip{max-width:1280px;margin:7px auto 16px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.context-strip b{color:var(--gold2);font-weight:500}.context-strip span{color:var(--muted);font-size:13px}.context-q{max-width:760px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sidebox{padding:18px;display:flex;flex-direction:column;gap:12px}.slot-list{display:grid;gap:10px}.slot{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(2,8,14,.4);border:1px solid rgba(215,170,89,.14)}.slot.filled{border-color:rgba(215,170,89,.42)}.mini-back{aspect-ratio:.585;background:linear-gradient(135deg,#07182a,#0b2239);border:1px solid rgba(215,170,89,.28);border-radius:8px;display:grid;place-items:center;color:#d9bb7f;font-size:18px}.slot strong{display:block;color:#ead7b1;font-weight:500}.slot span{display:block;margin-top:4px;color:#9d927e;font-size:12px;line-height:1.45}
.reading-shell{max-width:1380px;margin:0 auto;padding:8px 0 32px}.reading-grid{display:grid;grid-template-columns:1fr 370px;gap:18px}.spread-panel{padding:18px}.spread-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}.spread-name{color:var(--gold2);font-size:18px}.spread-sub{color:#9c9079;font-size:13px}.card-stage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
.tarot-wrap{text-align:center}.tarot-stage{width:min(100%,270px);margin:0 auto;perspective:1600px;cursor:pointer}.tarot-inner{position:relative;aspect-ratio:.62;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.7,.2,1);transform:translateY(0)}.tarot-wrap.revealed .tarot-inner{transform:rotateY(180deg)}.tarot-wrap.revealed.reversed .tarot-front img{transform:rotate(180deg)}.tarot-face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;overflow:hidden;border:1px solid rgba(215,170,89,.28);box-shadow:0 18px 28px rgba(0,0,0,.28)}.tarot-back{background:linear-gradient(135deg,#07182a,#0b2239)}.tarot-back:before{content:"";position:absolute;inset:11px;border:1px solid rgba(215,170,89,.35);border-radius:11px}.tarot-back:after{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--gold);font-size:34px}.tarot-front{background:#f5f1e7;transform:rotateY(180deg);display:grid;place-items:center;padding:6px}.tarot-front img{width:100%;height:100%;object-fit:contain;transition:transform .45s ease}.fallback{display:none;inset:0;position:absolute;place-items:center;padding:18px;text-align:center;color:#433;line-height:1.5;background:#f4efe4}.tarot-label{margin-top:12px;color:#e8d8b5;font-size:17px}.tarot-name{margin-top:6px;color:#cdb78b;font-size:13px;min-height:38px;line-height:1.4}.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;border:1px solid rgba(215,170,89,.28);margin-top:4px;color:#cdb386}.badge.rev{border-color:#c59368;color:#efc8a6}.reveal-hint{margin-top:6px;font-size:11px;color:#7f7460}
.interpret-panel{padding:18px}.locked{min-height:240px;display:grid;place-items:center;text-align:center;color:#9b907b;line-height:1.75}.summary-score{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 15px}.tone{padding:6px 10px;border-radius:999px;border:1px solid rgba(215,170,89,.28);font-size:12px}.tone.good{color:#cfe8c9;border-color:rgba(143,178,141,.45)}.tone.bad{color:#efc3ad;border-color:rgba(215,130,118,.42)}.tone.neutral{color:#ddc59c}.interpret-body .line{padding:12px 0;border-bottom:1px solid rgba(215,170,89,.12);line-height:1.75;color:#dbcfbb}.interpret-body .line:last-child{border-bottom:0}.interpret-body .overall{margin-top:16px;padding:16px;border-radius:16px;background:rgba(2,8,14,.42);border:1px solid rgba(215,170,89,.12);line-height:1.8;color:#ead9b8}
.follow-panel{margin-top:16px;padding:18px}.follow-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.follow-custom{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.follow-custom input{flex:1;min-width:240px;border:1px solid rgba(215,170,89,.25);background:rgba(2,8,14,.55);border-radius:12px;color:var(--text);padding:12px}.clarifiers{display:grid;gap:12px;margin-top:14px}.clarifier{display:grid;grid-template-columns:94px 1fr;gap:12px;padding:12px;border-radius:14px;background:rgba(2,8,14,.42);border:1px solid rgba(215,170,89,.12)}.clarifier img{width:94px;height:150px;object-fit:contain;border-radius:10px;background:#f5f1e7;border:1px solid rgba(215,170,89,.2);cursor:pointer}.clarifier .q{color:var(--gold2);margin-bottom:6px}.clarifier p{margin:6px 0 0;color:#cfc2ac;line-height:1.65}.clarifier .ori{margin-left:6px;font-size:11px;color:#c59972}
.footer-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.modal{position:fixed;inset:0;background:rgba(1,3,7,.72);display:none;place-items:center;padding:clamp(10px,3vw,24px);overflow-y:auto;overscroll-behavior:contain;z-index:40}.modal.show{display:grid}.modal-card{width:min(960px,100%);max-height:calc(100vh - 40px);max-height:calc(100dvh - 40px);padding:16px 18px 18px;overflow:hidden}.modal-body{max-height:calc(100vh - 140px);max-height:calc(100dvh - 140px);display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);grid-template-areas:"visual content";align-items:start;gap:clamp(16px,3vw,28px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:rgba(215,170,89,.55) transparent;padding-right:4px}.modal-body::-webkit-scrollbar{width:8px}.modal-body::-webkit-scrollbar-track{background:transparent}.modal-body::-webkit-scrollbar-thumb{background:rgba(215,170,89,.5);border-radius:999px}.modal-body img{grid-area:visual;width:100%;height:min(420px,calc(100dvh - 142px));object-fit:contain;border-radius:14px;background:#f5f1e7;border:1px solid rgba(215,170,89,.2);position:sticky;top:0}.modal-body>div{grid-area:content;min-width:0;overflow-wrap:anywhere}.modal-card h3{margin:0 0 10px;color:var(--gold2);font-size:24px;line-height:1.4;overflow-wrap:anywhere;word-break:keep-all}.modal-card p{margin:0 0 12px;color:#d5c8b4;line-height:1.75;overflow-wrap:anywhere}.modal-close{position:relative;display:block;margin:0 0 14px auto;z-index:2}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);padding:12px 16px;border-radius:12px;background:#0b1d30;color:#f3e0b7;border:1px solid rgba(215,170,89,.35);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.disclaimer{margin-top:10px;color:#8f8574;font-size:12px;line-height:1.6}
@media (max-width:1100px){.setup-grid,.draw-layout,.reading-grid{grid-template-columns:1fr}.card-stage-grid{grid-template-columns:1fr}.deck-grid{grid-template-columns:repeat(8,1fr)}}
@media (max-width:760px){.hero h1{font-size:52px}.category-grid{grid-template-columns:1fr 1fr}.deck-grid{grid-template-columns:repeat(6,1fr)}.topbar{padding-inline:0}.app{padding:14px}.footer-actions .btn.primary{min-width:unset;width:100%}.modal-card{padding:12px 14px 16px}.modal-body{grid-template-columns:1fr;grid-template-areas:"visual" "content";max-height:calc(100vh - 134px);max-height:calc(100dvh - 134px)}.modal-body img{width:min(100%,220px);height:min(300px,36dvh);position:static;justify-self:center}.modal-card h3{font-size:clamp(19px,5.4vw,24px)}}
@media (max-width:540px){.category-grid{grid-template-columns:1fr}.deck-grid{grid-template-columns:repeat(4,1fr)}.clarifier{grid-template-columns:1fr}}
</style>

<body>
<div class="app">
  <div class="corner tl"><i></i></div><div class="corner tr"><i></i></div><div class="corner br"><i></i></div><div class="corner bl"><i></i></div>
  <div class="shell">
    <div class="topbar"><div class="brand"><span class="moon"></span><span>TAROT · OFFLINE</span></div><div class="progress" id="progress"></div></div>
    <section class="screen active" id="screen-home"><div class="hero"><div class="eyebrow">CELESTIAL DIVINATION</div><h1>TAROT</h1><p>당신이 알고 싶은 것은 무엇입니까?</p><div class="rule"></div></div><div class="category-grid" id="categoryGrid"></div><div class="helper">운세 분야를 먼저 고른 뒤 질문을 구체화합니다.</div><div class="actions"><button class="btn primary" id="homeStart" disabled>질문 설정으로 이동</button></div></section>

function shuffle(a){const x=[...a]; for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]} return x}

function currentSpread(){return spreads[state.preset||inferPreset(state.category,state.question)]}
function renderCategories(){const host=$('#categoryGrid'); host.innerHTML=''; Object.entries(categories).forEach(([key,v])=>{const b=document.createElement('button'); b.className='category'+(state.category===key?' selected':''); b.innerHTML=`<div class="sigil">${v.icon}</div><strong>${v.name}</strong><small>${v.desc}</small>`; b.onclick=()=>{state.category=key; renderCategories(); $('#homeStart').disabled=false}; host.appendChild(b)})}
function prepareSetup(){const c=categories[state.category]; $('#setupTitle').textContent=c.name; const qh=$('#questionChips'); qh.innerHTML=''; c.templates.forEach((q,idx)=>{const b=document.createElement('button'); b.className='chip'+(idx===0?' selected':''); b.textContent=q.text; b.onclick=()=>{$$('#questionChips .chip').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); state.question=q.text; state.preset=q.preset; state.customQuestion=false; $('#customQuestion').value=''; syncPreview(); validateSetup()}; qh.appendChild(b)}); const ph=$('#periods'); ph.innerHTML=''; periods.forEach((p,i)=>{const b=document.createElement('button'); b.className='period'+(i===2?' selected':''); b.textContent=p; b.onclick=()=>{$$('#periods .period').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); state.period=p; validateSetup()}; ph.appendChild(b)}); state.period='3개월'; state.question=c.templates[0].text; state.preset=c.templates[0].preset; state.customQuestion=false; $('#customQuestion').value=''; $('#customQuestion').oninput=e=>{const v=e.target.value.trim(); if(v){ state.question=v; state.preset=inferPreset(state.category,v); state.customQuestion=true; $$('#questionChips .chip').forEach(x=>x.classList.remove('selected')); } else { state.question=''; state.preset=''; state.customQuestion=true; } syncPreview(); validateSetup()}; $('#setupDisclaimer').textContent=state.category==='health'?'건강운은 자기 돌봄과 컨디션 관리에 대한 상징적 리딩입니다. 의료적 진단이나 처방을 대신하지 않습니다.':''; syncPreview(); validateSetup(); showScreen('screen-setup',2)}
function syncPreview(){const sp=currentSpread(); $('#spreadPreviewName').textContent=' · '+sp.name; $('#spreadPreview').innerHTML=sp.labels.map(x=>`<span>${x}</span>`).join(''); $('#spreadPreviewDesc').textContent=sp.desc; $('#questionMirror').textContent=state.question||'질문을 선택해 주세요.';}
function validateSetup(){$('#setupNext').disabled=!(state.question&&state.period&&currentSpread())}
function initDraw(){state.deck=shuffle(cards); state.picked=[]; state.revealed=0; state.followups=[]; state.used=new Set(); const c=categories[state.category]; const sp=currentSpread(); $('#drawCategory').textContent=c.name; $('#drawPeriod').textContent='· '+state.period; $('#drawQuestion').textContent=state.question; $('#drawSpreadName').textContent=sp.name; $('#drawSpreadDesc').textContent=sp.labels.join(' · '); renderDeck(); renderSlots(); showScreen('screen-draw',3)}
function renderDeck(){const host=$('#deckGrid'); host.innerHTML=''; state.deck.forEach((card,idx)=>{const b=document.createElement('button'); b.className='deck-card'; b.dataset.idx=idx; b.style.setProperty('--rot',`${((idx%7)-3)*0.8}deg`); b.style.setProperty('--ty',`${(idx%5===0?1:0)}px`); b.style.setProperty('--delay',`${idx*9}ms`); b.innerHTML='<span class="pick-no"></span>'; b.onclick=()=>pickCard(idx,b); host.appendChild(b)}); updateDraw()}
function pickCard(idx,el){if(state.picked.length>=3||state.picked.some(x=>x.idx===idx)) return; const card=state.deck[idx]; const reversed=Math.random()<0.48; state.picked.push({idx,card,reversed}); state.used.add(card.id); el.classList.add('picked'); el.querySelector('.pick-no').textContent=state.picked.length; renderSlots(); updateDraw()}
function renderSlots(){const sp=currentSpread(); const host=$('#pickSlots'); host.innerHTML=''; for(let i=0;i<3;i++){const p=state.picked[i]; const div=document.createElement('div'); div.className='slot'+(p?' filled':''); div.innerHTML=`<div class="mini-back">${p?i+1:'✦'}</div><div><strong>${sp.labels[i]}</strong><span>${p?`${p.card.nameKo} · ${p.reversed?'역방향':'정방향'}`:'아직 선택하지 않았습니다.'}</span></div>`; host.appendChild(div)}}
function updateDraw(){$('#pickCount').textContent=state.picked.length; $('#drawNext').disabled=state.picked.length!==3; $('#deckNote').textContent=state.picked.length<3?`78장의 카드 중 ${3-state.picked.length}장을 더 선택하세요.`:'세 장을 모두 골랐습니다. 공개 화면으로 이동하세요.'}
function initReading(){state.revealed=0; state.followups=[]; const c=categories[state.category]; const sp=currentSpread(); $('#readingTitle').textContent=c.name; $('#readingPrompt').textContent=sp.labels.join(' · '); $('#readCategory').textContent=c.name; $('#readPeriod').textContent='· '+state.period; $('#readQuestion').textContent=state.question; $('#readingSpreadName').textContent=sp.name; $('#readingSpreadDesc').textContent=sp.desc; $('#readingDisclaimer').textContent=state.category==='health'?'※ 건강 관련 해석은 오락 및 자기성찰 목적입니다. 증상이나 질환이 우려되면 의료 전문가와 상담하세요.':''; renderSpread(); lockInterpret(); $('#followPanel').style.display='none'; $('#clarifiers').innerHTML=''; updateRevealButton(); showScreen('screen-reading',4)}
function renderSpread(){const host=$('#spreadCards'); host.innerHTML=''; const labels=currentSpread().labels; state.picked.forEach((p,i)=>{const w=document.createElement('div'); w.className='tarot-wrap'+(p.reversed?' reversed':''); w.dataset.i=i; w.innerHTML=`<div class="tarot-stage" title="카드를 눌러 공개"><div class="tarot-inner"><div class="tarot-face tarot-back"></div><div class="tarot-face tarot-front"><img src="${p.card.img}" alt="${p.card.nameKo}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="fallback">${p.card.nameKo}</div></div></div></div><div class="tarot-label">${labels[i]}</div><div class="tarot-name">?</div><div class="reveal-hint">카드를 눌러 공개</div>`; w.querySelector('.tarot-stage').onclick=()=>revealOne(i); host.appendChild(w)})}
function revealOne(i){if(i!==state.revealed){ if(i<state.revealed) openCardModal(state.picked[i]); else toast(`${state.revealed+1}번째 카드를 먼저 공개하세요.`); return; } const p=state.picked[i]; const w=$(`.tarot-wrap[data-i="${i}"]`); w.classList.add('revealed'); w.querySelector('.tarot-name').innerHTML=`${p.card.nameKo}<br><span class="badge ${p.reversed?'rev':''}">${p.reversed?'역방향':'정방향'}</span>`; w.querySelector('.reveal-hint').textContent='클릭하면 카드 의미 보기'; state.revealed++; updateRevealButton(); if(state.revealed===3) setTimeout(showInterpretation,650)}
function updateRevealButton(){const b=$('#revealBtn'); if(state.revealed>=3){b.textContent='세 장 공개 완료'; b.disabled=true;} else {b.disabled=false; b.textContent=['첫 번째 카드 공개','두 번째 카드 공개','세 번째 카드 공개'][state.revealed]; b.onclick=()=>revealOne(state.revealed);}}
function roleToneHook(role, tone){if(/미래|흐름|전개|방향/.test(role)) return tone>0?'전망은 열려 있지만 실행이 따라야 현실이 됩니다.':tone<0?'예상보다 느리거나 우회적인 전개가 나타날 수 있습니다.':'결정적 호재도 악재도 아니므로 변수를 관리하는 쪽이 유리합니다.'; if(/마음|상태|배경|현재/.test(role)) return tone>0?'출발점 자체는 나쁘지 않습니다.':tone<0?'현재의 부담이 이미 누적되어 있을 수 있습니다.':'지금은 판단보다 관찰이 우선입니다.'; if(/조언|포인트|선택/.test(role)) return tone>0?'실행할수록 성과가 붙는 자리입니다.':tone<0?'무리해서 밀어붙이기보다 손실을 줄이는 방향이 우선입니다.':'기준을 정교하게 세우는 것이 핵심입니다.'; return ''}
function cardMeaning(entry){const card=entry.card, reversed=entry.reversed, category=state.category; if(card.type==='major'){const idx=+card.code; const essence=majorEssence[idx]; const cat=majorCategory[category][idx]; const main = reversed ? `${cat}의 에너지가 순조롭게 흐르기보다 뒤집히거나 지연된 모습입니다. ${essence.shadow}의 그림자가 강해질 수 있습니다.` : `${cat}이 핵심 메시지입니다. 이번 자리는 '${essence.core}'의 흐름이 선명하게 나타납니다.`; const advice = reversed ? `역방향에서는 ${essence.advice} 다만 조급하게 결론을 내리면 ${essence.shadow} 쪽으로 기울기 쉽습니다.` : essence.advice; return {main, advice, keywords: reversed ? `${essence.shadow} · 역방향` : `${essence.core} · 정방향`}; } const suit=suitTheme[card.suit], rank=rankMeta[card.rank]; const theme=suit[category]; const ori = reversed ? `'${rank.core}'의 에너지가 막히거나 과장된 형태로 드러날 수 있습니다.` : `'${rank.core}'을(를) 통해 상황을 보여줍니다.`; const main = `${theme}의 영역에서 ${ori}`; const advice = reversed ? `지금은 서두르기보다 꼬인 지점을 풀어야 합니다. ${rank.advice} ${suitCaution[card.suit]}` : `${rank.advice} ${suitCaution[card.suit]}`; return {main, advice, keywords: `${rank.core} · ${theme} · ${reversed?'역방향':'정방향'}`}; }
function summarizeEnergy(){let score=0, major=0, reversed=0; const suits={w:0,c:0,s:0,p:0}; state.picked.forEach(p=>{score+=effectiveTone(p.card,p.reversed); if(p.card.type==='major') major++; else suits[p.card.suit]++; if(p.reversed) reversed++;}); let dominant=null, max=0; for(const [k,v] of Object.entries(suits)) if(v>max){max=v; dominant=k;} return {score, major, reversed, dominant, suitCount:max}; }
function dominantSuitText(suit){return {w:'행동과 추진력의 비중이 큽니다.',c:'감정과 관계적 기류가 강하게 작동합니다.',s:'판단과 소통, 긴장 관리가 핵심입니다.',p:'현실성과 지속 가능성이 중심 이슈입니다.'}[suit]||''}
function overallText(summary){const c=state.category, period=state.period; let text=''; if(summary.score>=2) text='전체 흐름은 비교적 우호적입니다. 다만 좋은 흐름일수록 기회를 분별하고 실행 우선순위를 정해야 실제 성과로 이어집니다.'; else if(summary.score<=-2) text='전체 흐름에는 분명한 경계 신호가 섞여 있습니다. 결론을 서두르기보다 손실·갈등·피로를 먼저 줄이는 편이 유리합니다.'; else text='좋은 요소와 부담 요소가 함께 보입니다. 한쪽으로 단정하기보다 확인 가능한 사실과 반복 행동을 기준으로 움직이는 편이 좋습니다.'; if(summary.major>=2) text+=' 메이저 아르카나가 많아 일상적인 변수보다 큰 흐름 또는 전환점의 색채가 강합니다.'; if(summary.suitCount>=2) text+=' 또한 '+dominantSuitText(summary.dominant); if(summary.reversed>=2) text+=' 역방향 카드가 여러 장 나왔으므로 타이밍 불일치, 심리적 저항, 이미 꼬여 있는 문제를 먼저 풀 필요가 있습니다.'; if(c==='money') text+=` ${period} 동안에는 기대수익보다 현금흐름, 손실 한도, 지속 가능성을 우선해서 판단하세요.`; if(c==='love') text+=` ${period} 동안에는 상대를 추측하기보다 말과 행동의 일치 여부를 차분히 확인하는 것이 핵심입니다.`; if(c==='career') text+=` ${period} 동안에는 역할, 보상, 성장성 중 무엇이 우선인지 분명히 정하면 판단이 쉬워집니다.`; if(c==='health') text+=` ${period} 동안에는 수면, 식사, 활동량, 스트레스 중 가장 흔들리는 한 가지부터 안정시키는 방식이 효과적입니다.`; return text; }
function showInterpretation(){const sp=currentSpread(); const summary=summarizeEnergy(); let html='<h3 style="margin:0;color:var(--gold2);font-size:26px">종합 해석</h3><div class="summary-score">'; state.picked.forEach(p=>{html+=toneLabel(effectiveTone(p.card,p.reversed));}); html+='</div><div class="interpret-body">'; state.picked.forEach((p,i)=>{const m=cardMeaning(p); html+=`<div class="line"><b>${sp.labels[i]} · ${p.card.nameKo} <span style="font-size:12px;color:${p.reversed?'#d9a07d':'#a99672'}">(${p.reversed?'역방향':'정방향'})</span></b><br>${m.main}<br>${roleToneHook(sp.labels[i], effectiveTone(p.card,p.reversed))}<br><span style="color:#9f927b">${m.advice}</span></div>`; }); html+=`<div class="overall">${overallText(summary)}</div></div>`; $('#interpretPanel').innerHTML=html; renderFollowChips(); $('#followPanel').style.display='block'; }
function lockInterpret(){$('#interpretPanel').innerHTML='<div class="locked"><div><strong>아직 모든 카드가 공개되지 않았습니다.</strong><br>세 장을 순서대로 공개하면 종합 해석이 나타납니다.</div></div>'}
function renderFollowChips(){const host=$('#followChips'); host.innerHTML=''; const usedQ=new Set(state.followups.map(x=>x.q)); categories[state.category].follow.forEach(q=>{const b=document.createElement('button'); b.className='chip'; b.textContent=q; b.disabled=state.followups.length>=3||usedQ.has(q); b.onclick=()=>drawClarifier(q,b); host.appendChild(b)}); $('#followCount').textContent=`${state.followups.length} / 3`; $('#followAsk').disabled=state.followups.length>=3; $('#followInput').disabled=state.followups.length>=3;}
function drawClarifier(q,btn){q=normalizeText(q); if(!q){toast('추가 질문을 입력하세요.'); return;} if(state.followups.length>=3) return; const remain=state.deck.filter(c=>!state.used.has(c.id)); if(!remain.length) return; const card=remain[Math.floor(Math.random()*remain.length)]; const reversed=Math.random()<0.45; state.used.add(card.id); const entry={q,card,reversed}; state.followups.push(entry); if(btn) btn.disabled=true; $('#followInput').value=''; renderClarifiers(); renderFollowChips()}
function renderClarifiers(){const host=$('#clarifiers'); host.innerHTML=''; state.followups.forEach((f,idx)=>{const m=cardMeaning(f); const d=document.createElement('div'); d.className='clarifier'; d.innerHTML=`<img src="${f.card.img}" alt="${f.card.nameKo}"><div><div class="q">Q${idx+1}. ${f.q}</div><b>${f.card.nameKo}</b><span class="ori">${f.reversed?'역방향':'정방향'}</span><p>${m.main} ${m.advice}</p></div>`; d.querySelector('img').onclick=()=>openCardModal(f); host.appendChild(d)}); $('#followCount').textContent=`${state.followups.length} / 3`;}
function openCardModal(entry){const card=entry.card||entry; const reversed=entry.reversed||false; const m=cardMeaning({card,reversed}); $('#modalTitle').textContent=card.nameKo+' · '+card.nameEn+' · '+(reversed?'역방향':'정방향'); $('#modalImg').src=card.img; $('#modalImg').alt=card.nameKo; $('#modalText').innerHTML=`<p><b>키워드</b><br>${m.keywords}</p><p><b>핵심 의미</b><br>${m.main}</p><p><b>조언</b><br>${m.advice}</p><p style="color:#817867;font-size:12px">이 버전은 카드 정방향과 역방향을 모두 반영합니다.</p>`; $('#cardModal').classList.add('show')}
function resetAll(){state.category=null; state.question=''; state.period=''; state.preset=''; state.deck=[]; state.picked=[]; state.revealed=0; state.followups=[]; state.used=new Set(); renderCategories(); $('#homeStart').disabled=true; showScreen('screen-home',1)}
$('#followAsk').onclick=()=>drawClarifier($('#followInput').value,null); $('#followInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault(); drawClarifier($('#followInput').value,null)}}); $('#homeStart').onclick=prepareSetup; $('#setupBack').onclick=()=>showScreen('screen-home',1); $('#setupNext').onclick=initDraw; $('#drawBack').onclick=()=>showScreen('screen-setup',2); $('#drawNext').onclick=initReading; $('#readingHome').onclick=resetAll; $('#redraw').onclick=initDraw; $('#modalClose').onclick=()=>$('#cardModal').classList.remove('show'); $('#cardModal').onclick=e=>{if(e.target.id==='cardModal') $('#cardModal').classList.remove('show')}; document.addEventListener('keydown',e=>{if(e.key==='Escape') $('#cardModal').classList.remove('show')});
renderCategories(); renderProgress(1);
</script>
</body>
</html>
